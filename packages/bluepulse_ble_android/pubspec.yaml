name: bluepulse_ble_android
description: "BluePulse's Android BLE transmitter: advertises a simulated EYE device or beacon with an exact interval, transmit power and name."
publish_to: none

environment:
  sdk: ^3.13.7
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.mapmyindia.bluepulse.bluepulse_ble_android
        pluginClass: BluepulseBleAndroidPlugin
