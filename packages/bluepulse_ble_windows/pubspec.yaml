name: bluepulse_ble_windows
description: "BluePulse's Windows BLE scanner: every advertisement and scan response as received, with raw AD sections."
publish_to: none

environment:
  sdk: ^3.13.7
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      windows:
        pluginClass: BluepulseBleWindowsPluginCApi
